server {
  # 8080: lo esperan Cloud Run, Railway, Render, etc. y no requiere root.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  # Para el healthcheck del contenedor / balanceador
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # config.json y index.html: nunca en caché (cambian por entorno / versión)
  location = /config.json {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  # Archivos con hash en el nombre: caché de 1 año
  location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # Rutas de Angular (/ventas, /compras...): siempre devolver index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
